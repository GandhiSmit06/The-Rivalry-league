  <circle cx="60" cy="60" r="16" fill="url(#trlBallGrad)" stroke="#ffd666" strokeWidth="1.5" />
  <path d="M 46 60 C 53 53, 67 67, 74 60" fill="none" stroke="#ffffff" strokeWidth="1.8" strokeDasharray="2.5 1.8" />
