    <rect x="57" y="10" width="6" height="24" rx="2.5" fill="#1d39c4" stroke="#85a5ff" strokeWidth="0.8" />
    <path d="M 54.5 34 L 65.5 34 L 67 98 C 67 104 60 106 60 106 C 60 106 53 104 53 98 Z" fill="url(#trlWoodA)" stroke="#8c5807" strokeWidth="1" />
