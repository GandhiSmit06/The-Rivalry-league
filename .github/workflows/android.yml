name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync Capacitor (points the app at the hosted site)
        env:
          CAP_SERVER_URL: ${{ vars.CAP_SERVER_URL }}
        run: |
          if [ -z "$CAP_SERVER_URL" ]; then echo "Set repo variable CAP_SERVER_URL (Settings > Secrets and variables > Actions > Variables)"; exit 1; fi
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: rivalry-league-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
